name: build-debug
on:
  push:
    branches: [npu-fix]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate or install sdkmanager
        id: sdk
        shell: bash
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          CMDLINE=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1 || true)
          if [ -z "$CMDLINE" ]; then
            echo "No sdkmanager found, downloading cmdline-tools..."
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSLo /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest" || true
            CMDLINE="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "SDKMANAGER=$CMDLINE" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "Using: $CMDLINE"

      - name: Accept licenses
        run: yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

      - name: Install SDK packages
        run: |
          yes | "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            2>&1 | tail -n 40

      - name: Install NDK (best effort, several common versions)
        run: |
          for v in 26.1.10909125 26.3.11579264 27.0.12077973 27.2.12479018 28.0.13004108; do
            echo "Installing ndk;$v ..."
            yes | "$SDKMANAGER" --install "ndk;$v" 2>&1 | tail -n 2 || true
          done

      - name: Gradle build
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-dream-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
